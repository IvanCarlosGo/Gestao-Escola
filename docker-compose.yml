services:
  db:
    image: mysql:8.0
    container_name: escola_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-gestao_escolar}
      MYSQL_USER: ${DB_USER:-escola_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-escola_pass}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_pass}
    ports:
      - "3307:3306"
    volumes:
      - db-data:/var/lib/mysql
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-root_pass}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: escola_app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 3000
      TZ: ${TZ:-Atlantic/Cape_Verde}
      SESSION_SECRET: ${SESSION_SECRET:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@escola.cv}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-0}
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: ${DB_USER:-escola_user}
      DB_PASSWORD: ${DB_PASSWORD:-escola_pass}
      DB_NAME: ${DB_NAME:-gestao_escolar}
    ports:
      - "3000:3000"
    volumes:
      - ./:/usr/src/app
      - /usr/src/app/node_modules

  # Painel da plataforma (dono do projeto): escolas, administradores, secretarias e contínuos
  painel:
    build: .
    container_name: escola_painel
    restart: unless-stopped
    command: ["node", "painel/server.js"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      PAINEL_PORT: 8080
      TZ: ${TZ:-Atlantic/Cape_Verde}
      SESSION_SECRET: ${SESSION_SECRET:-}
      PAINEL_EMAIL: ${PAINEL_EMAIL:-plataforma@escola.cv}
      PAINEL_PASSWORD: ${PAINEL_PASSWORD:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-0}
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: ${DB_USER:-escola_user}
      DB_PASSWORD: ${DB_PASSWORD:-escola_pass}
      DB_NAME: ${DB_NAME:-gestao_escolar}
    ports:
      - "8080:8080"
    volumes:
      - ./:/usr/src/app
      - /usr/src/app/node_modules

  # Gestor genérico da base de dados (só para emergências)
  adminer:
    image: adminer
    container_name: escola_adminer
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "8081:8080"

volumes:
  db-data:
